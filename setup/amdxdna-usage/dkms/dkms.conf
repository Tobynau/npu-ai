PACKAGE_NAME="amdxdna-usage"
PACKAGE_VERSION="1.0"

# Source is the in-tree driver from linux v7.2.6; only build it for 7.2.x kernels.
BUILD_EXCLUSIVE_KERNEL="^7\.2\."

PATCH[0]="0001-accel-amdxdna-report-NPU-busy-time-and-memory-use.patch"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_DRM_ACCEL_AMDXDNA=m modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="amdxdna"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
